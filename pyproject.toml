[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ispace-downloader"
version = "0.1.0"
description = "Local course-aware BNBU iSpace downloader"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5", "playwright>=1.51,<2", "keyring>=25,<26",
  "cryptography>=44", "filelock>=3.17,<4", "tzdata>=2025.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ispace = "ispace.__main__:main"

[tool.setuptools.package-data]
ispace = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
