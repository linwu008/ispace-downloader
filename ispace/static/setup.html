<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CourseNest · 电脑设置</title>
    <link rel="stylesheet" href="/static/setup.css" />
    <script defer src="/static/setup.js"></script>
  </head>
  <body>
    <main>
      <h1>CourseNest 电脑设置</h1>
      <p>这里只设置这台电脑。课程、同步和学期存档请在官网管理。</p>
      <a href="https://bnbucoursenest.cn">返回 CourseNest 官网 ↗</a>
      <p id="message" role="status">正在连接助手…</p>
      <section class="card">
        <h2>1. 连接官网账号</h2>
        <p id="connection"></p>
        <form id="pair">
          <label
            >官网生成的配对码<input id="code" required maxlength="30" /></label
          ><button>连接电脑</button>
        </form>
      </section>
      <section class="card">
        <h2>2. 登录学校 iSpace</h2>
        <p>学校登录信息保存在这台电脑，不发送到 CourseNest 官网。</p>
        <button id="login">打开学校登录窗口</button>
      </section>
      <section class="card">
        <h2>3. 选择课程保存文件夹</h2>
        <button id="refresh">刷新学校课程</button>
        <div id="courses"></div>
      </section>
      <section class="card">
        <h2>运行设置</h2>
        <button id="disconnect">断开当前配对</button
        ><button id="disable-schedule">关闭旧的电脑每日计划</button>
        <p>关闭旧计划后，可在官网统一设置每日同步；不会删除已下载文件。</p>
      </section>
      <p>设置完成后可以关闭此页面，保持助手在后台运行。</p>
    </main>
  </body>
</html>
