name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cloud/test/*.test.mjs
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m playwright install chromium
      - run: python scripts/check_ui_v3.py
      - run: python scripts/check_ui_v4.py
      - run: python scripts/check_ui_v5.py
      - run: python scripts/check_ui_v6.py
      - run: python scripts/check_ui_v7.py
      - run: python scripts/check_ui_public.py
      - run: python scripts/check_ui_v1.py
      - run: python -m pip install -r requirements-build.lock
      - run: ./scripts/build_assistant.ps1 -PythonPath python
      - run: python scripts/check_bundle.py
      # Release packages are published separately to coursenest-releases.
      # CI validates the package without retaining duplicate large artifacts.

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      OPENSSL_STATIC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -c "import platform; assert platform.machine() == '${{ matrix.arch }}'"
      - name: Locate OpenSSL for Intel source build
        if: matrix.arch == 'x86_64'
        run: echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: python -m pip install --no-cache-dir -r requirements.lock -r requirements-build.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: node --test cloud/test/*.test.mjs
      - run: python -m playwright install chromium
      - name: Browser regressions
        run: |
          for check in v3 v4 v5 v6 v7 public v1; do
            python scripts/check_ui_$check.py || exit 1
          done
      - run: python scripts/build_assistant_macos.py
      - run: python scripts/check_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: CourseNestHelper-macos-${{ matrix.arch }}
          path: |
            dist/CourseNestHelper-*-macos-*.zip
            dist/CourseNestHelper-*-macos-*.zip.sha256
          retention-days: 7
